<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#555555">
    <title>MasterCrafter – Minecraft Quiz</title>
    <link rel="stylesheet" href="/minecraft-theme.css">
    <link rel="stylesheet" href="/style.css">
    <script src="/game.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">MASTER<span>CRAFTER</span></a>
        <nav class="mode-nav" aria-label="Game mode"><a href="/">Crafting</a><a href="/quiz.html" aria-current="page">Item quiz</a></nav>
    </header>
    <main>
        <section class="game" aria-labelledby="game-title">
            <p class="eyebrow">RECOGNIZE THIS ITEM?</p>
            <h1 id="game-title">What is this?</h1>
            <p class="intro">Look at the picture and choose the correct name.</p>
            <div class="item-stage">
                <div class="item-slot">
                    <img id="item-image" alt="The Minecraft item to identify" width="112" height="112" hidden>
                    <span id="loading-icon" aria-hidden="true">?</span>
                </div>
            </div>
            <div id="options" class="options" aria-label="Answer choices"></div>
            <p id="feedback" class="feedback" role="status" aria-live="polite">Loading a question…</p>
            <button id="next" class="next" type="button" hidden>Next question <span aria-hidden="true">→</span></button>
            <noscript>Enable JavaScript in your browser to play.</noscript>
        </section>
    </main>
    <footer>Built by Oscar &amp; Codex <span aria-hidden="true">·</span> One item at a time.</footer>
</body>
</html>
