<!doctype html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#142a25">
    <title>MasterCrafter – Minecraft-quiz</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/game.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">MASTER<span>CRAFTER</span></a>
        <nav class="mode-nav" aria-label="Spelläge"><a href="/">Crafting</a><a href="/quiz.html" aria-current="page">Frågespel</a></nav>
    </header>
    <main>
        <section class="game" aria-labelledby="game-title">
            <p class="eyebrow">KÄNNER DU IGEN FÖREMÅLET?</p>
            <h1 id="game-title">Vad heter det här?</h1>
            <p class="intro">Kolla på bilden och välj rätt namn.</p>
            <div class="item-stage">
                <div class="item-slot">
                    <img id="item-image" alt="Minecraft-föremålet du ska namnge" width="112" height="112" hidden>
                    <span id="loading-icon" aria-hidden="true">?</span>
                </div>
            </div>
            <div id="options" class="options" aria-label="Svarsalternativ"></div>
            <p id="feedback" class="feedback" role="status" aria-live="polite">Hämtar en fråga…</p>
            <button id="next" class="next" type="button" hidden>Nästa fråga <span aria-hidden="true">→</span></button>
            <noscript>Aktivera JavaScript i webbläsaren för att spela.</noscript>
        </section>
    </main>
    <footer>Byggt av Oscar &amp; Codex <span aria-hidden="true">·</span> Ett föremål i taget.</footer>
</body>
</html>
